name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish standalone unpackaged app
        run: dotnet publish "WinLANTransfer.csproj" -c Release -p:Platform=x64 -o "publish/WinLANTransfer_Portable"

      - name: Package portable ZIP
        shell: pwsh
        run: |
          if (-not (Test-Path 'publish/WinLANTransfer_Portable/resources.pri')) { throw 'App PRI missing from publish output' }
          Compress-Archive -Path "publish/WinLANTransfer_Portable/*" -DestinationPath "WinLANTransfer-${{ github.ref_name }}-win-x64.zip"

      - name: Create GitHub Release and upload asset
        uses: softprops/action-gh-release@v2
        with:
          files: WinLANTransfer-*-win-x64.zip
          generate_release_notes: true
          overwrite_files: true
